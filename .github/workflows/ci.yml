name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, test, build and SEO checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from lockfile
        run: npm ci

      - name: Whitespace and conflict-marker check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff --check "origin/$BASE_REF...HEAD"

      - name: Type-check
        run: npm run lint

      - name: Unit and negative tests
        run: npm test

      - name: Production build
        env:
          VERCEL_ENV: production
        run: npm run build

      - name: SEO checks against source
        run: npm run verify:seo

      - name: SEO checks against built output
        run: npm run verify:seo:dist
