<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--page-head-->
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem("theme"); } catch {}
        const theme = saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.classList.replace("dark", theme);
      })();
    </script>
    <noscript>
      <style>
        #root [style*="opacity:0"] { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>

    <link rel="preload" href="/fonts/instrument-serif/normal-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-neutral-800 selection:text-neutral-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
